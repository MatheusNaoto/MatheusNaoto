name: Gerar APK do launcher

on:
  push:
    paths:
      - 'celular-minimo/launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar APK
        working-directory: celular-minimo/launcher
        run: gradle --no-daemon assembleRelease

      - name: Renomear
        run: cp celular-minimo/launcher/app/build/outputs/apk/release/app-release.apk MinimoLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinimoLauncher
          path: MinimoLauncher.apk
